<!--
  Ransomware Tripwire — MANAGER ossec.conf (on the Wazuh manager)

  Add these blocks to /var/ossec/etc/ossec.conf on the MANAGER, then restart
  wazuh-manager. Wazuh reads <command> and <active-response> only from the manager;
  placing them in an agent's config has no effect.

  The referenced script (isolate_host.cmd, which launches isolate_host.ps1) must be
  deployed to the agent's active-response\bin directory. <location>local</location>
  runs the response on whichever agent produced the triggering alert (rules
  100201/100202/100203 — canary modified/deleted).
-->
<ossec_config>
  <command>
    <name>isolate-ransomware-host</name>
    <executable>isolate_host.cmd</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <active-response>
    <command>isolate-ransomware-host</command>
    <location>local</location>
    <rules_id>100201,100202,100203</rules_id>
    <timeout>0</timeout>
  </active-response>
</ossec_config>
