<!--
  Ransomware Tripwire — AGENT ossec.conf (on the monitored Windows endpoint)

  Add this <syscheck> block to C:\Program Files (x86)\ossec-agent\ossec.conf (or push
  it via the manager's shared agent.conf), then restart the agent.

  The active-response/command blocks do NOT go here — an agent ignores them. They live
  on the manager: see manager_active_response.conf in this folder.
-->
<ossec_config>
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Real-time File Integrity Monitoring with Whodata for canary directories.
         Whodata attaches the responsible process (syscheck.audit.process.id) to the
         alert, which isolate_host.ps1 uses to terminate the offending process. -->
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">C:\Users\Public\Documents</directories>
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">C:\Users\LabAdmin\Desktop</directories>
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">C:\Users\LabAdmin\Documents</directories>
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">C:\Shares\Finance_Records</directories>

    <synchronization>
      <enabled>yes</enabled>
      <interval>10m</interval>
      <max_interval>1h</max_interval>
      <response_timeout>30</response_timeout>
    </synchronization>
  </syscheck>
</ossec_config>
